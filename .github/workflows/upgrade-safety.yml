name: Upgrade Safety Tool Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test plan checker and TFC trust boundaries (no credentials)
        run: python3 -m unittest discover -s tests -p 'test_upgrade*.py' -v
